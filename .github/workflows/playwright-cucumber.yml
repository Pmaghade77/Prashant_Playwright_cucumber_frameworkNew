
name: Playwright Cucumber CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Install and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare Allure results directory
        run: mkdir -p allure-results

      - name: Run Cucumber tests
        run: npx cucumber-js --format progress --format json:cucumber-debug.json

      - name: Upload Cucumber debug report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-debug-report
          path: cucumber-debug.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate Allure HTML report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ "$(find allure-results -name '*-result.json' -type f | wc -l)" -gt 0 ]; then
            npx allure generate allure-results --output allure-report --clean
          else
            echo "No Allure test result JSON files were generated."
            exit 0
          fi

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-raw-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Configure GitHub Pages
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

      - name: Deploy Allure report to GitHub Pages
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Email Allure screenshot
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          TEST_STATUS: ${{ job.status }}
        run: node scripts/email-allure-report.js
